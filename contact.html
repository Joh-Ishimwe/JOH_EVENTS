<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | JOH EVENTS</title>
  <meta name="description" content="Get in touch with JOH EVENTS to plan your wedding or event in Kigali.">
  <meta property="og:title" content="Contact | JOH EVENTS">
  <meta property="og:description" content="Get in touch with JOH EVENTS to plan your wedding or event in Kigali.">
  <meta property="og:image" content="https://johevents.rw/assets/images/og-image.jpg">
  <link rel="canonical" href="https://johevents.rw/contact.html">
  <link rel="icon" href="assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body data-page="contact">
  <div id="site-header"></div>
  <main>

<section class="page-hero">
  <div class="media " data-label="Banner: reception table"><img src="assets/images/contact-hero.jpg" alt="Banner: reception table" loading="lazy" onerror="this.remove()"></div>
  <div class="container"><h1>Get in Touch</h1><p>Let's plan something meaningful.</p></div>
</section>
<section class="section">
  <div class="container contact-grid">
    <div>
      <h2 style="font-size:1.9rem">Contact information</h2>
      <ul class="contact-list">
        <li><span data-icon="phone"></span><span data-site="phone"></span></li>
        <li><span data-icon="email"></span><a data-email-link><span data-site="email"></span></a></li>
        <li><span data-icon="pin"></span><span data-site="location"></span></li>
      </ul>
      <h2 style="font-size:1.9rem">Follow us</h2>
      <ul class="contact-list">
        <li><span data-icon="instagram"></span><a data-instagram-link target="_blank" rel="noopener">Instagram</a></li>
        <li><span data-icon="tiktok"></span><a data-tiktok-link target="_blank" rel="noopener">TikTok</a></li>
        <li><span data-icon="whatsapp"></span><a data-whatsapp-link target="_blank" rel="noopener">WhatsApp</a></li>
      </ul>
    </div>
    <div>
      <h2 style="font-size:1.9rem;margin-bottom:24px">Send us a message</h2>
      <form class="form" id="contact-form" novalidate>
        <div class="form-row">
          <div class="field"><label for="name">Full name *</label><input id="name" name="name" required autocomplete="name"><p class="error">Enter your name.</p></div>
          <div class="field"><label for="email">Email address *</label><input id="email" name="email" type="email" required autocomplete="email"><p class="error">Enter a valid email, like name@example.com.</p></div>
        </div>
        <div class="form-row">
          <div class="field"><label for="event-type">Event type</label>
            <select id="event-type" name="event_type"><option>Wedding</option><option>Engagement</option><option>Private event</option><option>Corporate event</option><option>Other</option></select></div>
          <div class="field"><label for="date">Event date</label><input id="date" name="event_date" type="date"></div>
        </div>
        <div class="field"><label for="message">Your message *</label><textarea id="message" name="message" required placeholder="Tell us about your vision, guest count and what you need help with."></textarea><p class="error">Add a short message.</p></div>
        <div class="hp" aria-hidden="true"><label>Leave empty<input name="_gotcha" tabindex="-1" autocomplete="off"></label></div>
        <p class="form-status" role="status" aria-live="polite"></p>
        <div><button type="submit" class="btn">Send Message</button></div>
      </form>
    </div>
  </div>
</section>

  </main>
  <div id="site-footer"></div>
  <script src="/assets/js/main.js"></script>
</body>
</html>
